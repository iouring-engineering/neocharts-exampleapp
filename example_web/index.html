<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NeoCharts — JS host demo</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- The NeoCharts loader: a classic script (never defer/module), or it
         throws at load time. Base URL is VITE_SDK_ASSET_BASE (see .env) --
         `npm run dev` points it at /build_web/, a symlink to the SDK's
         `build/web`; `npm run build` uses the CDN. Loading it before the
         module script below guarantees `window.neoCharts` exists by mount. -->
    <script src="%VITE_SDK_ASSET_BASE%neocharts.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
